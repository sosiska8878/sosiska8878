<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphite</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #252526;
            --border: #333333;
            --text: #d4d4d4;
            --muted: #8a8a8a;
            --accent: #7aa2f7;
            --hover: #2a2a2a;
            --selection: #35405a;
            --code-bg: #2d2d2d;
            --error: #f7768e;
            --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --mono-font: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            --editor-font-size: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--ui-font);
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--hover); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

        /* Welcome Screen */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 16px;
        }
        .welcome-title { font-size: 32pt; font-weight: 600; }
        .welcome-subtitle { color: var(--muted); font-size: 12pt; margin-bottom: 24px; }
        .welcome-btn {
            background-color: var(--accent);
            color: var(--bg);
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .welcome-btn:hover { opacity: 0.9; }
        .welcome-note { color: var(--muted); font-size: 10pt; margin-top: 32px; }

        /* Main Layout */
        #main-app { display: none; width: 100vw; height: 100vh; flex-direction: row; }
        #main-app.active { display: flex; }

        /* Sidebar */
        #sidebar {
            width: 280px;
            min-width: 200px;
            background-color: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 16px;
            font-weight: 600;
            font-size: 16px;
            border-bottom: 1px solid var(--border);
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 13px;
        }
        .tab-btn.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }
        .tab-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .action-row, .search-row {
            padding: 8px;
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border);
        }
        .action-row button, .search-row button {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .action-row button:hover, .search-row button:hover {
            background: var(--hover);
            color: var(--text);
        }

        input[type="text"], select, textarea {
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 6px 8px;
            outline: none;
            font-family: inherit;
            font-size: 13px;
            width: 100%;
        }
        input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--accent); }

        .tree-container { flex: 1; overflow-y: auto; padding: 8px 0; }
        .tree-item {
            padding: 6px 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            user-select: none;
            border-left: 2px solid transparent;
        }
        .tree-item:hover { background-color: var(--hover); }
        .tree-item.selected {
            background-color: var(--selection);
            border-left-color: var(--accent);
        }
        .tree-icon { font-size: 14px; }
        .tree-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tree-children { /* Indent handled by JS */ }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
        }

        /* Settings */
        .settings-panel { padding: 16px; overflow-y: auto; }
        .setting-row { margin-bottom: 16px; }
        .setting-row label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
        .slider-row { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex: 1; }

        /* Editor Area */
        #editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg);
            overflow: hidden;
        }
        #editor-header {
            height: 40px;
            background-color: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 13px;
        }
        #file-status { color: var(--muted); font-size: 12px; }
        #file-status.dirty { color: var(--accent); }
        #file-status.error { color: var(--error); }

        #markdown-toolbar {
            background-color: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 6px 12px;
            display: flex;
            gap: 4px;
            align-items: center;
        }
        #markdown-toolbar button {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--mono-font);
            font-size: 13px;
        }
        #markdown-toolbar button:hover { background: var(--hover); color: var(--text); }
        #markdown-toolbar .separator { width: 1px; height: 16px; background: var(--border); margin: 0 6px; }

        #find-bar {
            background-color: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #find-bar input { max-width: 300px; }
        #find-count { font-size: 12px; color: var(--muted); min-width: 80px; }

        #editor-splitter {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #editor {
            flex: 1;
            background-color: var(--bg);
            color: var(--text);
            border: none;
            padding: 24px;
            font-family: var(--mono-font);
            font-size: var(--editor-font-size);
            line-height: 1.6;
            resize: none;
            outline: none;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        #preview {
            flex: 1;
            padding: 24px 48px;
            overflow-y: auto;
            border-left: 1px solid var(--border);
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
        }

        /* Markdown Preview Styles */
        #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
            color: var(--text); font-weight: 600; margin: 1.2em 0 0.5em 0; line-height: 1.3;
        }
        #preview h1 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: 0.2em; }
        #preview h2 { font-size: 1.5em; }
        #preview h3 { font-size: 1.25em; }
        #preview p { margin: 0.8em 0; line-height: 1.6; }
        #preview a { color: var(--accent); text-decoration: none; }
        #preview a:hover { text-decoration: underline; }
        #preview code {
            font-family: var(--mono-font); font-size: 0.92em; background-color: var(--code-bg);
            border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px;
        }
        #preview pre {
            background-color: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
            padding: 12px 16px; overflow-x: auto; margin: 1em 0;
        }
        #preview pre code { background: transparent; border: none; padding: 0; font-size: 0.9em; white-space: pre-wrap; }
        #preview blockquote {
            margin: 1em 0; padding: 0.2em 0 0.2em 16px; border-left: 3px solid var(--accent); color: var(--muted);
        }
        #preview ul, #preview ol { margin: 0.8em 0; padding-left: 1.6em; }
        #preview li { margin: 0.3em 0; }
        #preview table { border-collapse: collapse; margin: 1em 0; width: 100%; }
        #preview th, #preview td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        #preview th { background-color: var(--panel); font-weight: 600; }
        #preview img { max-width: 100%; border-radius: 6px; }
        #preview input[type="checkbox"] { margin-right: 8px; transform: scale(1.2); }
        #preview hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
    </style>
</head>
<body>

    <!-- Welcome Screen -->
    <div id="welcome-screen">
        <h1 class="welcome-title">Graphite</h1>
        <p class="welcome-subtitle">Минимальное локальное хранилище markdown-заметок</p>
        <button id="btn-open-vault" class="welcome-btn">Открыть папку</button>
        <p class="welcome-note">Требуется современный браузер (Chrome, Edge, Opera) для работы с локальными файлами</p>
    </div>

    <!-- Main App -->
    <div id="main-app">
        <!-- Sidebar -->
        <div id="sidebar">
            <div class="sidebar-header">Graphite</div>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="files">Файлы</button>
                <button class="tab-btn" data-tab="search">Поиск</button>
                <button class="tab-btn" data-tab="settings">Настройки</button>
            </div>

            <div class="tab-content" id="tab-files">
                <div class="action-row">
                    <button id="btn-new-note" title="Ctrl+N">+ Заметка</button>
                    <button id="btn-new-folder">+ Папка</button>
                    <button id="btn-refresh">Обновить</button>
                </div>
                <div class="tree-container" id="file-tree"></div>
            </div>

            <div class="tab-content" id="tab-search" style="display: none;">
                <div class="search-row">
                    <input type="text" id="search-input" placeholder="Поиск по имени...">
                </div>
                <div class="tree-container" id="search-tree"></div>
            </div>

            <div class="tab-content" id="tab-settings" style="display: none;">
                <div class="settings-panel">
                    <div class="setting-row">
                        <label>Тема оформления</label>
                        <select id="setting-theme">
                            <option value="Graphite Dark">Graphite Dark</option>
                            <option value="Midnight">Midnight</option>
                            <option value="Nord">Nord</option>
                            <option value="Sepia Light">Sepia Light</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label>Размер шрифта редактора</label>
                        <div class="slider-row">
                            <input type="range" id="setting-font-size" min="10" max="24" value="14">
                            <span id="font-size-val">14px</span>
                        </div>
                    </div>
                    <div class="setting-row">
                        <label>Перенос строк</label>
                        <input type="checkbox" id="setting-wrap" checked>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div id="note-count">0 заметок</div>
                <div id="vault-path">Хранилище не выбрано</div>
            </div>
        </div>

        <!-- Editor Area -->
        <div id="editor-area">
            <div id="editor-header">
                <span id="file-name">Без названия</span>
                <span id="file-status"></span>
            </div>
            
            <div id="find-bar" style="display: none;">
                <input type="text" id="find-input" placeholder="Поиск в заметке...">
                <span id="find-count"></span>
                <button onclick="app.findPrev()">←</button>
                <button onclick="app.findNext()">→</button>
                <button onclick="app.hideFind()">✕</button>
            </div>

            <div id="markdown-toolbar">
                <button onclick="app.wrapSelection('**')" title="Полужирный (Ctrl+B)"><b>B</b></button>
                <button onclick="app.wrapSelection('*')" title="Курсив (Ctrl+I)"><i>I</i></button>
                <button onclick="app.wrapSelection('~~')" title="Зачёркнутый"><s>S</s></button>
                <button onclick="app.wrapSelection('`')" title="Код">&lt;/&gt;</button>
                <span class="separator"></span>
                <button onclick="app.toggleLinePrefix('# ')">H1</button>
                <button onclick="app.toggleLinePrefix('## ')">H2</button>
                <button onclick="app.toggleLinePrefix('### ')">H3</button>
                <span class="separator"></span>
                <button onclick="app.toggleLinePrefix('- ')">•</button>
                <button onclick="app.toggleLinePrefix('1. ')">1.</button>
                <button onclick="app.toggleLinePrefix('> ')">"</button>
                <span class="separator"></span>
                <button onclick="app.insertLink()">🔗</button>
                <button onclick="app.insertImage()">🖼</button>
            </div>

            <div id="editor-splitter">
                <textarea id="editor" spellcheck="false" placeholder="Начните писать..."></textarea>
                <div id="preview"></div>
            </div>
        </div>
    </div>

    <script>
        marked.setOptions({ gfm: true, breaks: true });

        class VaultManager {
            constructor() {
                this.rootHandle = null;
                this.files = new Map(); 
            }

            async open() {
                try {
                    this.rootHandle = await window.showDirectoryPicker();
                    this.files.clear();
                    await this.scanDirectory(this.rootHandle, "");
                    return true;
                } catch (e) {
                    console.error(e);
                    return false;
                }
            }

            async scanDirectory(dirHandle, path) {
                for await (const entry of dirHandle.values()) {
                    if (entry.name.startsWith('.')) continue;
                    const entryPath = path ? `${path}/${entry.name}` : entry.name;
                    
                    if (entry.kind === 'directory') {
                        this.files.set(entryPath, { handle: entry, isDir: true, name: entry.name });
                        await this.scanDirectory(entry, entryPath);
                    } else if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.md')) {
                        this.files.set(entryPath, { handle: entry, isDir: false, name: entry.name });
                    }
                }
            }
            
            async readFile(path) {
                const entry = this.files.get(path);
                if (!entry || entry.isDir) return "";
                const file = await entry.handle.getFile();
                return await file.text();
            }
            
            async writeFile(path, content) {
                const entry = this.files.get(path);
                if (!entry || entry.isDir) return;
                const writable = await entry.handle.createWritable();
                await writable.write(content);
                await writable.close();
            }
            
            async createNote(parentPath, name = "Новая заметка") {
                const parentEntry = parentPath ? this.files.get(parentPath).handle : this.rootHandle;
                let fileName = name.endsWith('.md') ? name : `${name}.md`;
                
                let count = 1;
                let finalName = fileName;
                let testPath = parentPath ? `${parentPath}/${finalName}` : finalName;
                while (this.files.has(testPath)) {
                    const ext = fileName.substring(fileName.lastIndexOf('.'));
                    const base = fileName.substring(0, fileName.lastIndexOf('.'));
                    finalName = `${base} ${count}${ext}`;
                    testPath = parentPath ? `${parentPath}/${finalName}` : finalName;
                    count++;
                }
                
                const fileHandle = await parentEntry.getFileHandle(finalName, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(`# ${finalName.replace('.md', '')}\n\n`);
                await writable.close();
                
                const newPath = parentPath ? `${parentPath}/${finalName}` : finalName;
                this.files.set(newPath, { handle: fileHandle, isDir: false, name: finalName });
                return newPath;
            }
            
            async createFolder(parentPath, name = "Новая папка") {
                const parentEntry = parentPath ? this.files.get(parentPath).handle : this.rootHandle;
                let finalName = name;
                let count = 1;
                let testPath = parentPath ? `${parentPath}/${finalName}` : finalName;
                while (this.files.has(testPath)) {
                    finalName = `${name} ${count}`;
                    testPath = parentPath ? `${parentPath}/${finalName}` : finalName;
                    count++;
                }
                
                const dirHandle = await parentEntry.getDirectoryHandle(finalName, { create: true });
                const newPath = parentPath ? `${parentPath}/${finalName}` : finalName;
                this.files.set(newPath, { handle: dirHandle, isDir: true, name: finalName });
                return newPath;
            }
        }

        class GraphiteApp {
            constructor() {
                this.vault = new VaultManager();
                this.currentFilePath = null;
                this.isDirty = false;
                this.saveTimeout = null;
                this.renderTimeout = null;
                this.currentTab = 'files';
                this.expandedPaths = new Set();
                
                this.initUI();
                this.loadSettings();
                this.bindEvents();
            }

            initUI() {
                this.welcomeScreen = document.getElementById('welcome-screen');
                this.mainApp = document.getElementById('main-app');
                this.editor = document.getElementById('editor');
                this.preview = document.getElementById('preview');
                this.fileNameEl = document.getElementById('file-name');
                this.fileStatusEl = document.getElementById('file-status');
                this.fileTreeEl = document.getElementById('file-tree');
                this.searchTreeEl = document.getElementById('search-tree');
                this.noteCountEl = document.getElementById('note-count');
                this.vaultPathEl = document.getElementById('vault-path');
            }

            bindEvents() {
                document.getElementById('btn-open-vault').addEventListener('click', () => this.openVault());
                document.getElementById('btn-new-note').addEventListener('click', () => this.createNote());
                document.getElementById('btn-new-folder').addEventListener('click', () => this.createFolder());
                document.getElementById('btn-refresh').addEventListener('click', () => this.refreshTree());
                
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.switchTab(btn.dataset.tab));
                });

                this.editor.addEventListener('input', () => this.onEditorInput());
                document.getElementById('search-input').addEventListener('input', (e) => this.refreshTree(e.target.value));
                document.getElementById('find-input').addEventListener('input', () => this.updateFindCount());
                
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        if (e.key === 's') { e.preventDefault(); this.saveCurrent(); }
                        else if (e.key === 'b') { e.preventDefault(); this.wrapSelection('**'); }
                        else if (e.key === 'i') { e.preventDefault(); this.wrapSelection('*'); }
                        else if (e.key === 'f') { e.preventDefault(); this.showFind(); }
                    } else if (e.key === 'Escape') {
                        this.hideFind();
                    }
                });

                document.getElementById('setting-theme').addEventListener('change', (e) => this.applyTheme(e.target.value));
                document.getElementById('setting-font-size').addEventListener('input', (e) => {
                    const size = e.target.value;
                    document.documentElement.style.setProperty('--editor-font-size', `${size}px`);
                    document.getElementById('font-size-val').textContent = `${size}px`;
                    localStorage.setItem('fontSize', size);
                });
                document.getElementById('setting-wrap').addEventListener('change', (e) => {
                    this.editor.style.whiteSpace = e.target.checked ? 'pre-wrap' : 'pre';
                    this.editor.style.overflowX = e.target.checked ? 'hidden' : 'auto';
                    localStorage.setItem('wrap', e.target.checked);
                });
            }

            async openVault() {
                if (!('showDirectoryPicker' in window)) {
                    alert("Ваш браузер не поддерживает File System Access API.\nПожалуйста, используйте Chrome, Edge или Opera.");
                    return;
                }
                
                const success = await this.vault.open();
                if (success) {
                    this.welcomeScreen.style.display = 'none';
                    this.mainApp.classList.add('active');
                    this.vaultPathEl.textContent = this.vault.rootHandle.name;
                    this.refreshTree();
                }
            }

            switchTab(tab) {
                this.currentTab = tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
                document.getElementById('tab-files').style.display = tab === 'files' ? 'flex' : 'none';
                document.getElementById('tab-search').style.display = tab === 'search' ? 'flex' : 'none';
                document.getElementById('tab-settings').style.display = tab === 'settings' ? 'flex' : 'none';
                if (tab === 'search') document.getElementById('search-input').focus();
            }

            async openNote(path) {
                if (this.currentFilePath === path) return;
                
                if (this.isDirty) {
                    if (!confirm("Есть несохранённые изменения. Сохранить?")) {
                        this.isDirty = false;
                    } else {
                        await this.saveCurrent();
                    }
                }
                
                try {
                    const content = await this.vault.readFile(path);
                    this.editor.value = content;
                    this.currentFilePath = path;
                    this.fileNameEl.textContent = path.split('/').pop();
                    this.isDirty = false;
                    this.setStatus("Сохранено");
                    this.updatePreview();
                    this.refreshTree();
                } catch (e) {
                    console.error(e);
                    alert("Ошибка чтения файла");
                }
            }

            onEditorInput() {
                this.isDirty = true;
                this.setStatus("Изменено...", "dirty");
                
                clearTimeout(this.renderTimeout);
                this.renderTimeout = setTimeout(() => this.updatePreview(), 300);
                
                clearTimeout(this.saveTimeout);
                this.saveTimeout = setTimeout(() => this.saveCurrent(), 1500);
            }

            async saveCurrent() {
                if (!this.currentFilePath || !this.isDirty) return;
                
                this.setStatus("Сохранение...", "dirty");
                try {
                    await this.vault.writeFile(this.currentFilePath, this.editor.value);
                    this.isDirty = false;
                    this.setStatus("Сохранено");
                } catch (e) {
                    console.error(e);
                    this.setStatus("Ошибка сохранения", "error");
                }
            }

            setStatus(text, cls = "") {
                this.fileStatusEl.textContent = text;
                this.fileStatusEl.className = cls;
            }

            updatePreview() {
                const md = this.editor.value;
                let html = marked.parse(md);
                html = html.replace(/<li>\s*\[\s\]\s*/g, '<li><input type="checkbox" disabled> ');
                html = html.replace(/<li>\s*\[x\]\s*/gi, '<li><input type="checkbox" checked disabled> ');
                this.preview.innerHTML = html;
            }

            refreshTree(query = "") {
                const treeContainer = this.currentTab === 'search' ? this.searchTreeEl : this.fileTreeEl;
                treeContainer.innerHTML = '';
                
                const root = { name: 'root', children: [], isDir: true };
                const nodes = { "": root };
                
                const sortedPaths = Array.from(this.vault.files.keys()).sort();
                
                for (const path of sortedPaths) {
                    const entry = this.vault.files.get(path);
                    if (query && !entry.isDir) {
                        if (!entry.name.toLowerCase().includes(query.toLowerCase())) continue;
                    }
                    
                    const parts = path.split('/');
                    let currentParent = root;
                    let currentPath = "";
                    
                    for (let i = 0; i < parts.length; i++) {
                        const part = parts[i];
                        currentPath = currentPath ? `${currentPath}/${part}` : part;
                        
                        if (!nodes[currentPath]) {
                            const isDir = i < parts.length - 1; 
                            const node = { name: part, path: currentPath, isDir: isDir, children: [] };
                            nodes[currentPath] = node;
                            currentParent.children.push(node);
                        }
                        currentParent = nodes[currentPath];
                    }
                }
                
                treeContainer.appendChild(this.buildTreeDOM(root));
                
                let count = 0;
                for (const entry of this.vault.files.values()) {
                    if (!entry.isDir) count++;
                }
                this.noteCountEl.textContent = `${count} ${this.pluralize(count, ['заметка', 'заметки', 'заметок'])}`;
            }

            buildTreeDOM(node, depth = 0) {
                const fragment = document.createDocumentFragment();
                
                if (node.name !== 'root') {
                    const item = document.createElement('div');
                    item.className = 'tree-item ' + (node.isDir ? 'is-dir' : 'is-file');
                    if (this.currentFilePath === node.path) item.classList.add('selected');
                    
                    item.style.paddingLeft = `${depth * 16 + 8}px`;
                    item.dataset.path = node.path;
                    
                    const icon = document.createElement('span');
                    icon.className = 'tree-icon';
                    icon.textContent = node.isDir ? '📁' : '📄';
                    
                    const label = document.createElement('span');
                    label.className = 'tree-label';
                    label.textContent = node.name;
                    
                    item.appendChild(icon);
                    item.appendChild(label);
                    
                    if (!node.isDir) {
                        item.addEventListener('click', () => this.openNote(node.path));
                    } else {
                        item.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const isExpanded = item.classList.toggle('expanded');
                            if (isExpanded) this.expandedPaths.add(node.path);
                            else this.expandedPaths.delete(node.path);
                            
                            const childrenContainer = item.nextElementSibling;
                            if (childrenContainer) {
                                childrenContainer.style.display = isExpanded ? 'block' : 'none';
                            }
                        });
                        
                        if (this.expandedPaths.has(node.path)) {
                            item.classList.add('expanded');
                        }
                    }
                    fragment.appendChild(item);
                }
                
                if (node.children.length > 0) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'tree-children';
                    if (node.name !== 'root' && !this.expandedPaths.has(node.path)) {
                        childrenContainer.style.display = 'none';
                    }
                    node.children.forEach(child => {
                        childrenContainer.appendChild(this.buildTreeDOM(child, depth + 1));
                    });
                    fragment.appendChild(childrenContainer);
                }
                
                return fragment;
            }

            pluralize(n, forms) {
                n = Math.abs(n);
                const n10 = n % 10;
                const n100 = n % 100;
                if (n10 === 1 && n100 !== 11) return forms[0];
                if (n10 >= 2 && n10 <= 4 && (n100 < 11 || n100 > 14)) return forms[1];
                return forms[2];
            }

            async createNote() {
                const name = prompt("Имя новой заметки:", "Новая заметка");
                if (!name) return;
                
                let parentPath = null;
                const selected = document.querySelector('.tree-item.selected');
                if (selected) {
                    const path = selected.dataset.path;
                    const entry = this.vault.files.get(path);
                    if (entry && entry.isDir) parentPath = path;
                    else if (path.includes('/')) parentPath = path.substring(0, path.lastIndexOf('/'));
                }
                
                try {
                    const path = await this.vault.createNote(parentPath, name);
                    this.refreshTree();
                    this.openNote(path);
                } catch (e) {
                    console.error(e);
                    alert("Ошибка создания заметки");
                }
            }

            async createFolder() {
                const name = prompt("Имя новой папки:", "Новая папка");
                if (!name) return;
                
                let parentPath = null;
                const selected = document.querySelector('.tree-item.selected');
                if (selected) {
                    const path = selected.dataset.path;
                    const entry = this.vault.files.get(path);
                    if (entry && entry.isDir) parentPath = path;
                    else if (path.includes('/')) parentPath = path.substring(0, path.lastIndexOf('/'));
                }
                
                try {
                    await this.vault.createFolder(parentPath, name);
                    this.refreshTree();
                } catch (e) {
                    console.error(e);
                    alert("Ошибка создания папки");
                }
            }

            showFind() {
                document.getElementById('find-bar').style.display = 'flex';
                document.getElementById('find-input').focus();
            }

            hideFind() {
                document.getElementById('find-bar').style.display = 'none';
            }

            findNext() {
                const query = document.getElementById('find-input').value;
                if (!query) return;
                const text = this.editor.value;
                const start = this.editor.selectionEnd;
                let index = text.toLowerCase().indexOf(query.toLowerCase(), start);
                if (index === -1) index = text.toLowerCase().indexOf(query.toLowerCase());
                if (index !== -1) {
                    this.editor.selectionStart = index;
                    this.editor.selectionEnd = index + query.length;
                    this.editor.focus();
                }
            }

            findPrev() {
                const query = document.getElementById('find-input').value;
                if (!query) return;
                const text = this.editor.value;
                const start = this.editor.selectionStart;
                let index = text.toLowerCase().lastIndexOf(query.toLowerCase(), start - 1);
                if (index === -1) index = text.toLowerCase().lastIndexOf(query.toLowerCase());
                if (index !== -1) {
                    this.editor.selectionStart = index;
                    this.editor.selectionEnd = index + query.length;
                    this.editor.focus();
                }
            }

            updateFindCount() {
                const query = document.getElementById('find-input').value.toLowerCase();
                if (!query) {
                    document.getElementById('find-count').textContent = "";
                    return;
                }
                const text = this.editor.value.toLowerCase();
                let count = 0;
                let pos = 0;
                while ((pos = text.indexOf(query, pos)) !== -1) {
                    count++;
                    pos += query.length;
                }
                document.getElementById('find-count').textContent = count > 0 ? `${count} совпадений` : "нет совпадений";
            }

            wrapSelection(mark) {
                const start = this.editor.selectionStart;
                const end = this.editor.selectionEnd;
                const text = this.editor.value;
                const selected = text.substring(start, end);
                
                this.editor.value = text.substring(0, start) + mark + selected + mark + text.substring(end);
                
                if (selected.length === 0) {
                    this.editor.selectionStart = this.editor.selectionEnd = start + mark.length;
                } else {
                    this.editor.selectionStart = start + mark.length;
                    this.editor.selectionEnd = end + mark.length;
                }
                this.editor.focus();
                this.editor.dispatchEvent(new Event('input'));
            }

            toggleLinePrefix(prefix) {
                const start = this.editor.selectionStart;
                const text = this.editor.value;
                
                let lineStart = text.lastIndexOf('\n', start - 1) + 1;
                let lineEnd = text.indexOf('\n', start);
                if (lineEnd === -1) lineEnd = text.length;
                
                const line = text.substring(lineStart, lineEnd);
                const newLine = line.startsWith(prefix) ? line.substring(prefix.length) : prefix + line;
                
                this.editor.value = text.substring(0, lineStart) + newLine + text.substring(lineEnd);
                this.editor.selectionStart = this.editor.selectionEnd = lineStart + newLine.length;
                this.editor.focus();
                this.editor.dispatchEvent(new Event('input'));
            }

            insertLink() {
                const start = this.editor.selectionStart;
                const end = this.editor.selectionEnd;
                const text = this.editor.value;
                const selected = text.substring(start, end) || "текст";
                
                const insertion = `[${selected}](url)`;
                this.editor.value = text.substring(0, start) + insertion + text.substring(end);
                
                const urlStart = start + selected.length + 3;
                this.editor.selectionStart = urlStart;
                this.editor.selectionEnd = urlStart + 3;
                this.editor.focus();
                this.editor.dispatchEvent(new Event('input'));
            }

            insertImage() {
                const start = this.editor.selectionStart;
                const end = this.editor.selectionEnd;
                const text = this.editor.value;
                const selected = text.substring(start, end) || "alt";
                
                const insertion = `![${selected}](url)`;
                this.editor.value = text.substring(0, start) + insertion + text.substring(end);
                
                const urlStart = start + selected.length + 4;
                this.editor.selectionStart = urlStart;
                this.editor.selectionEnd = urlStart + 3;
                this.editor.focus();
                this.editor.dispatchEvent(new Event('input'));
            }

            loadSettings() {
                const theme = localStorage.getItem('theme') || 'Graphite Dark';
                this.applyTheme(theme);
                document.getElementById('setting-theme').value = theme;
                
                const fontSize = localStorage.getItem('fontSize') || '14';
                document.documentElement.style.setProperty('--editor-font-size', `${fontSize}px`);
                document.getElementById('setting-font-size').value = fontSize;
                document.getElementById('font-size-val').textContent = `${fontSize}px`;
                
                const wrap = localStorage.getItem('wrap') !== 'false';
                document.getElementById('setting-wrap').checked = wrap;
                this.editor.style.whiteSpace = wrap ? 'pre-wrap' : 'pre';
                this.editor.style.overflowX = wrap ? 'hidden' : 'auto';
            }

            applyTheme(name) {
                const themes = {
                    "Graphite Dark": { bg: "#1e1e1e", panel: "#252526", border: "#333333", text: "#d4d4d4", muted: "#8a8a8a", accent: "#7aa2f7", hover: "#2a2a2a", selection: "#35405a", code_bg: "#2d2d2d", error: "#f7768e" },
                    "Midnight": { bg: "#0f1419", panel: "#151b23", border: "#232c36", text: "#c0caf5", muted: "#565f89", accent: "#bb9af7", hover: "#1a2230", selection: "#283457", code_bg: "#1a2230", error: "#f7768e" },
                    "Nord": { bg: "#2e3440", panel: "#3b4252", border: "#434c5e", text: "#d8dee9", muted: "#7b88a1", accent: "#88c0d0", hover: "#434c5e", selection: "#4c566a", code_bg: "#3b4252", error: "#bf616a" },
                    "Sepia Light": { bg: "#fbf1c7", panel: "#f0e6d2", border: "#d5c4a1", text: "#3c3836", muted: "#7c6f64", accent: "#b58900", hover: "#eee8d5", selection: "#ebdbb2", code_bg: "#f5e8c7", error: "#9d0006" }
                };
                
                const theme = themes[name] || themes["Graphite Dark"];
                const root = document.documentElement;
                for (const [key, value] of Object.entries(theme)) {
                    root.style.setProperty(`--${key}`, value);
                }
                localStorage.setItem('theme', name);
            }
        }

        const app = new GraphiteApp();
    </script>
</body>
</html>
